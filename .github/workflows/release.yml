name: Release
permissions:
  contents: write
on:
  push:
    tags:
      - 'v[0-9]*.*.*'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Build
        run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o o_llama_relay .

      - name: Compress binary
        run: zip o_llama_relay-linux-amd64.zip o_llama_relay

      - name: Upload to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: o_llama_relay-linux-amd64.zip

  build-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Build
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o o_llama_relay.exe .

      - name: Compress binary
        run: zip o_llama_relay-windows-amd64.zip o_llama_relay.exe

      - name: Upload to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: o_llama_relay-windows-amd64.zip

  build-macos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Build amd64
        run: GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -o o_llama_relay .

      - name: Compress binary
        run: zip o_llama_relay-macos-amd64.zip o_llama_relay

      - name: Upload to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: o_llama_relay-macos-amd64.zip

      - name: Build arm64
        run: GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -o o_llama_relay .

      - name: Compress binary
        run: zip o_llama_relay-macos-arm64.zip o_llama_relay

      - name: Upload to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: o_llama_relay-macos-arm64.zip
